<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Numbered Row | Hybrid Interaction Design System</title>
    <meta name="description" content="The Numbered Row component at its default props.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap">

    <style>
        /* =========================================================
           DESIGN TOKENS
           Fonts, weights and the fluid type scale (hi-fonts.css + hi-typography.css),
           then colour, surface, radius, elevation, motion, space and layout
           (hi-tokens.css). Every page of the design system ships the same set.
        ========================================================= */
        :root {
            /* --- font families --- */
            --font-heading: 'Hanken Grotesk', system-ui, sans-serif;
            --font-caption: 'Hanken Grotesk', system-ui, sans-serif;
            --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;

            /* --- weights --- */
            --fw-extralight: 200;
            --fw-light: 300;
            --fw-regular: 400;
            --fw-medium: 500;
            --fw-semibold: 600;
            --fw-bold: 700;
            --fw-extrabold: 800;

            /* --- type scale (fluid) --- */
            --text-hero-size: clamp(40px, 6vw, 96px);
            --text-figure-size: clamp(48px, 8.6vw, 120px);
            --text-display-size: clamp(36px, 5.2vw, 78px);
            --text-h1-size: clamp(32px, 4.4vw, 64px);
            --text-h2-size: clamp(28px, 3.6vw, 52px);
            --text-h-feature-size: clamp(23px, 2.9vw, 42px);
            --text-h3-size: clamp(20px, 2vw, 27px);
            --text-body-lg-size: clamp(18px, 1.6vw, 22px);
            --text-body-md-size: 16.5px;
            --text-body-sm-size: 14.5px;
            --text-caption-size: 12px;
            --text-label-size: 15px;

            /* --- line heights --- */
            --lh-tight: 1;
            --lh-snug: 1.15;
            --lh-heading: 1.05;
            --lh-body: 1.6;

            /* --- letter spacing --- */
            --ls-hero: -.045em;
            --ls-heading: -.03em;
            --ls-h3: -.02em;
            --ls-caption: .2em;
            --ls-label: .02em;

            /* --- brand palette --- */
            --c-bg: #eaeaf2;
            --c-ink: #15131c;
            --c-dark: #180a2b;
            --c-dark-2: #170928;
            --c-accent: #7b52c7;
            --c-accent-bright: #9d73ff;
            --c-violet: #9b6fe0;
            --c-lav: #b79bff;
            --c-cyan: #00b7fa;
            --c-offwhite: #f1f8ff;
            --c-white: #ffffff;
            --c-grey: #6b6b76;
            --c-ds-panel: #12101a;

            /* --- text alpha steps --- */
            --c-ink-60: rgba(21, 19, 28, .6);
            --c-ink-55: rgba(21, 19, 28, .55);
            --c-ink-45: rgba(21, 19, 28, .45);
            --c-ink-16: rgba(21, 19, 28, .16);
            --c-offwhite-80: rgba(241, 248, 255, .8);
            --c-offwhite-62: rgba(241, 248, 255, .62);
            --c-offwhite-50: rgba(241, 248, 255, .5);
            --c-white-78: rgba(255, 255, 255, .78);
            --c-white-50: rgba(255, 255, 255, .5);
            --c-white-20: rgba(255, 255, 255, .2);
            --c-white-08: rgba(255, 255, 255, .08);

            /* --- partner brands --- */
            --brand-optimove: #302c69;
            --brand-optimove-pastel: #f4f4f7;
            --brand-smartico: #f15851;
            --brand-smartico-pastel: #fef2f1;
            --brand-fast-track: #e96092;
            --brand-fast-track-pastel: #fdf2f6;
            --brand-xtremepush: #003df5;
            --brand-xtremepush-pastel: #f1f4fe;
            --brand-customer-io: #0b363b;
            --brand-customer-io-pastel: #f2f4f5;
            --brand-solitics: #ffd400;
            --brand-solitics-pastel: #fff5c3;

            /* --- status --- */
            --c-success: #1f8a5b;
            --c-success-bright: #1fb26b;
            --c-success-soft: #1fd28a;
            --c-warning: #ffb038;
            --c-magenta: #c32e93;

            /* --- surfaces --- */
            --surface-light: #ffffff;
            --surface-tint: #faf8fd;
            --surface-tint-strong: #f7f4fd;
            --surface-neutral: #f1f1f4;
            --surface-hover: #f2f2f4;
            --grad-surface-grey: linear-gradient(145deg, #eeeef2 0%, #f6f6f8 52%, #ffffff 100%);
            --grad-surface-grey-dark: linear-gradient(145deg, rgba(255, 255, 255, .09) 0%, rgba(255, 255, 255, .05) 52%, rgba(255, 255, 255, .02) 100%);
            --grad-primary: linear-gradient(225deg, #8a62d8, #6a43b2);
            --grad-hero: linear-gradient(160deg, #1c0c3a 0%, #2c1356 44%, #46228a 100%);
            --grad-hero-deep: linear-gradient(160deg, #120724 0%, #1c0d38 46%, #2e155c 100%);
            --grad-card-dark: linear-gradient(135deg, #1a0a3a, #3d1a6e);
            --grad-card-dark-hover: linear-gradient(135deg, #26124f, #4d2589);
            --grad-panel: linear-gradient(180deg, #17161d, #111017);
            --grad-metric: linear-gradient(160deg, var(--c-accent), #4a248f);
            --grad-rule-light: linear-gradient(to right, rgba(21, 19, 28, .16), rgba(21, 19, 28, 0));
            --grad-rule-dark: linear-gradient(to right, rgba(255, 255, 255, .18), rgba(255, 255, 255, 0));

            /* --- borders --- */
            --border-light: 1px solid #eee9f6;
            --border-glass: 1px solid rgba(255, 255, 255, .16);
            --border-panel: 1px solid rgba(255, 255, 255, .07);
            --border-accent-soft: 1px solid rgba(123, 82, 199, .35);

            /* --- radii --- */
            --r-xs: 4px;
            --r-sm: 7px;
            --r-md: 12px;
            --r-lg: 16px;
            --r-xl: 20px;
            --r-2xl: 24px;
            --r-3xl: 26px;
            --r-pill: 100px;
            --r-circle: 50%;

            /* --- elevation --- */
            --shadow-tile: 0 4px 10px -4px rgba(24, 10, 43, .14), 0 1px 3px -1px rgba(24, 10, 43, .1);
            --shadow-pill: 0 8px 30px rgba(0, 0, 0, .28);
            --shadow-card: 0 24px 50px rgba(26, 10, 58, .12);
            --shadow-float: 0 20px 50px rgba(0, 0, 0, .35);
            --shadow-card-raised: 0 40px 90px rgba(26, 10, 58, .28);
            --shadow-card-hover: 0 54px 110px rgba(26, 10, 58, .42);
            --shadow-panel: 0 30px 70px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .05);
            --glow-accent: 0 4px 14px rgba(123, 82, 199, .6);

            /* --- blur --- */
            --blur-glass: 14px;
            --blur-card: 12px;

            /* --- motion --- */
            --dur-fast: .2s;
            --dur-base: .3s;
            --dur-mid: .4s;
            --dur-slow: .5s;
            --dur-shutter: .9s;
            --ease-out-quint: cubic-bezier(.16, 1, .3, 1);
            --ease-swift: cubic-bezier(.2, .8, .2, 1);
            --ease-standard: cubic-bezier(.4, 0, .2, 1);
            --ease-shutter: cubic-bezier(.76, 0, .24, 1);

            /* --- space --- */
            --space-xxs: 4px;
            --space-xs: 8px;
            --space-sm: 12px;
            --space-md: 14px;
            --space-lg: 16px;
            --space-xl: 20px;
            --space-2xl: 24px;
            --space-3xl: 34px;
            --space-4xl: 40px;
            --space-5xl: 56px;

            /* --- layout --- */
            --gutter: 5vw;
            --gut: max(5vw, calc((100vw - 1440px) / 2 + 5vw));
            --max-content: 1440px;
            --max-text: 1100px;
            --max-footer: 1280px;
            --nav-height: 78px;
            --ds-nav-width: 240px;
            --ds-sheet-max: 1120px;
            --ds-sheet-pad: 6vw;
        }

        /* =========================================================
           RESET
        ========================================================= */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--c-bg);
            color: var(--c-ink);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
        }

        /* NO percentage max-width here: logo marks sit in shrink-to-fit parents sized BY their
           image, and a percentage that resolves against such a parent collapses the image to 0.
           Containment is declared per component instead. */
        img,
        svg {
            display: block;
        }

        /* a component class with its own display value out-ranks the UA's [hidden] rule */
        [hidden] {
            display: none !important;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            margin: 0;
            font-family: var(--font-heading);
        }

        p {
            margin: 0;
        }

        button {
            font: inherit;
            color: inherit;
            cursor: pointer;
        }

        /* zero specificity: every component colour (buttons, tiles, menu rows, nav) wins in every state,
           the way the DC's inline styles beat its helmet link rule */
        :where(a) {
            color: var(--c-accent);
        }

        :where(a:hover) {
            color: #5a37a0;
        }

        code {
            font-family: var(--font-mono);
            font-size: .85em;
        }

        :focus-visible {
            outline: 2px solid rgba(157, 115, 255, .7);
            outline-offset: 2px;
        }

        .visually_hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        /* =========================================================
           TYPOGRAPHY
           The named type roles. Design-tool name in brackets:
           text_hero (.hi-hero) · text_figure (.hi-figure) · text_display (.hi-display)
           text_h1 / text_h2 / text_h_feature / text_h3 · eyebrow (.hi-eyebrow)
           figcaption (.hi-figcaption) · text_body_lg / _md / _sm · text_label
           prose--l/m/s + bullets (.hi-prose-*, .hi-bullets, .hi-bullet)
        ========================================================= */
        .text_hero {
            font-family: var(--font-heading);
            font-weight: var(--fw-light);
            font-size: var(--text-hero-size);
            line-height: .98;
            letter-spacing: var(--ls-hero);
        }

        .text_figure {
            font-family: var(--font-heading);
            font-weight: var(--fw-extralight);
            font-size: var(--text-figure-size);
            line-height: .82;
            letter-spacing: -.03em;
        }

        .text_display {
            font-family: var(--font-heading);
            font-weight: var(--fw-light);
            font-size: var(--text-display-size);
            line-height: var(--lh-tight);
            letter-spacing: -.04em;
        }

        .text_h1 {
            font-family: var(--font-heading);
            font-weight: var(--fw-light);
            font-size: var(--text-h1-size);
            line-height: 1.04;
            letter-spacing: -.035em;
        }

        .text_h2 {
            font-family: var(--font-heading);
            font-weight: var(--fw-light);
            font-size: var(--text-h2-size);
            line-height: var(--lh-heading);
            letter-spacing: var(--ls-heading);
        }

        .text_h_feature {
            font-family: var(--font-heading);
            font-weight: var(--fw-light);
            font-size: var(--text-h-feature-size);
            line-height: 1.1;
            letter-spacing: -.032em;
        }

        .text_h3 {
            font-family: var(--font-heading);
            font-weight: var(--fw-semibold);
            font-size: var(--text-h3-size);
            line-height: 1.2;
            letter-spacing: var(--ls-h3);
        }

        .eyebrow {
            font-family: var(--font-caption);
            font-weight: var(--fw-bold);
            font-size: var(--text-caption-size);
            line-height: 1;
            letter-spacing: var(--ls-caption);
            text-transform: uppercase;
        }

        .figcaption {
            font-family: var(--font-body);
            font-weight: var(--fw-regular);
            font-size: 13px;
            line-height: 1.5;
            letter-spacing: 0;
            text-transform: none;
            color: var(--c-ink-45);
        }

        .figcaption--on-dark {
            color: rgba(255, 255, 255, .5);
        }

        .text_body_lg {
            font-family: var(--font-body);
            font-weight: var(--fw-regular);
            font-size: var(--text-body-lg-size);
            line-height: var(--lh-body);
        }

        .text_body_md {
            font-family: var(--font-body);
            font-weight: var(--fw-regular);
            font-size: var(--text-body-md-size);
            line-height: var(--lh-body);
        }

        .text_body_sm {
            font-family: var(--font-body);
            font-weight: var(--fw-regular);
            font-size: var(--text-body-sm-size);
            line-height: 1.55;
        }

        .text_label {
            font-family: var(--font-body);
            font-weight: var(--fw-semibold);
            font-size: var(--text-label-size);
            letter-spacing: var(--ls-label);
        }

        /* --- body prose & bullets · sizes L / M / S --- */
        .prose--l,
        .bullets--l {
            --pf: clamp(17px, 1.5vw, 21px);
            --pl: 1.78;
            --bf: clamp(17px, 1.5vw, 21px);
            --bl: 1.6;
            --gap: clamp(11px, 1.2vw, 15px);
            --pad: 26px;
            --dot: 8px;
            --dtop: .62em;
            --bmar: clamp(20px, 2vw, 28px);
        }

        .prose--m,
        .bullets--m {
            --pf: clamp(15px, 1.25vw, 18px);
            --pl: 1.75;
            --bf: clamp(15px, 1.25vw, 18px);
            --bl: 1.6;
            --gap: clamp(10px, 1.05vw, 13px);
            --pad: 24px;
            --dot: 7px;
            --dtop: .6em;
            --bmar: clamp(18px, 1.7vw, 23px);
        }

        .prose--s,
        .bullets--s {
            --pf: clamp(14px, 1.05vw, 16px);
            --pl: 1.72;
            --bf: clamp(14px, 1.05vw, 16px);
            --bl: 1.58;
            --gap: 9px;
            --pad: 22px;
            --dot: 6px;
            --dtop: .6em;
            --bmar: 16px;
        }

        .prose {
            max-width: 64ch;
        }

        .prose > p {
            margin: 0;
            font-size: var(--pf);
            line-height: var(--pl);
            color: #33303e;
            text-wrap: pretty;
        }

        .prose > :not(:first-child) {
            margin-top: var(--bmar);
        }

        .bullets {
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .bullet {
            position: relative;
            padding-left: var(--pad);
            font-size: var(--bf);
            line-height: var(--bl);
            color: #33303e;
            text-wrap: pretty;
        }

        .bullet::before {
            content: "";
            position: absolute;
            left: 0;
            top: var(--dtop);
            width: var(--dot);
            height: var(--dot);
            border-radius: 2px;
            background: linear-gradient(135deg, #7b52c7, #9d73ff);
        }

        .bullet strong {
            font-weight: var(--fw-semibold);
            color: var(--c-ink);
        }

        /* =========================================================
           LAYOUT — component file stage
           A component file opened on its own: the component alone on a blank page,
           at its default props, exactly as the design tool previews it.
        ========================================================= */
        .component_body {
            background: var(--c-white);
        }

        .component_stage {
            display: block;
        }

        /* =========================================================
           COMPONENTS — article blocks
           The recurring pieces of News and Blog articles (design-tool names in
           brackets): article_lead (.hi-m-lead) · article_section + article_rule
           (.hi-m-section / .hi-m-rule) · article_quote (.hi-m-quote) · post_meta
           (.hi-m-postmeta) · dateline (.hi-m-dateline) · tag_list / topic_tag
           (.hi-m-tags / .hi-m-tag) · rail_fact (.hi-m-railfact).
        ========================================================= */
        .article_lead {
            max-width: 44ch;
            margin: 0;
            padding-left: clamp(20px, 2vw, 28px);
            background: linear-gradient(180deg, #7b52c7, rgba(123, 82, 199, 0)) left .5em / 3px calc(100% - .62em) no-repeat;
            font-size: clamp(21px, 1.72vw, 27px);
            font-weight: var(--fw-light);
            line-height: 1.62;
            color: #2c2937;
        }

        .article_section {
            max-width: 700px;
        }

        .article_section_title {
            max-width: 22ch;
            margin: 0 0 clamp(16px, 1.6vw, 22px);
            font-size: clamp(30px, 3.6vw, 52px);
            font-weight: var(--fw-light);
            line-height: 1.04;
            letter-spacing: -.034em;
        }

        .article_section p {
            margin: 0;
            font-size: clamp(18px, 1.36vw, 21px);
            line-height: 1.8;
            color: #33303e;
            text-wrap: pretty;
        }

        .article_rule {
            height: 1px;
            margin: 0 0 clamp(26px, 2.8vw, 38px);
            border: 0;
            background: linear-gradient(90deg, #e0dae9, rgba(224, 218, 233, 0));
        }

        /* the bar starts at the cap height of the first line and ends on the last baseline */
        .article_quote {
            max-width: 52ch;
            margin: 0;
            padding-left: clamp(20px, 2vw, 28px);
            background: linear-gradient(180deg, #7b52c7, rgba(123, 82, 199, 0)) left calc(.4em - 1px) / 3px calc(100% - .757em + 1px) no-repeat;
            font-size: clamp(19px, 1.5vw, 23px);
            line-height: 1.5;
            color: #33303e;
        }

        .article_quote strong {
            font-weight: var(--fw-semibold);
            color: var(--c-ink);
        }

        .post_meta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post_meta_category {
            color: var(--c-accent);
        }

        .post_meta_dot {
            flex: 0 0 auto;
            width: 2.5px;
            height: 2.5px;
            border-radius: 50%;
            background: #c2bacf;
        }

        .post_meta_date {
            color: #9a95a6;
        }

        .dateline {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            color: rgba(255, 255, 255, .5);
        }

        .dateline_kind {
            color: var(--c-accent-bright);
        }

        .dateline_sep {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .28);
        }

        .tag_list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .topic_tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 9px;
            border-radius: 6px;
            background: #f2eefb;
            color: #5a37a0;
            font-family: var(--font-heading);
            font-size: 10px;
            font-weight: var(--fw-bold);
            letter-spacing: .09em;
            text-decoration: none;
            text-transform: uppercase;
        }

        .topic_tag:hover {
            background: #e7dffa;
            color: #5a37a0;
        }

        .article_demo--dark .topic_tag,
        .topic_tag--on-dark {
            background: rgba(255, 255, 255, .09);
            color: #e6ddff;
        }

        .rail_fact {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rail_fact_label {
            color: rgba(255, 255, 255, .42);
        }

        .rail_fact_value {
            font-size: 15px;
            line-height: 1.5;
            color: var(--c-white);
        }

        /* =========================================================
           COMPONENTS — numbered row (Numbered Row.dc.html)
           Icon tile, heading, one line of copy and a large ordinal on the right.
           Rows share a top hairline that fades right; on hover the row shifts 10px
           and the heading takes the accent. Below 640px the tile stacks.
        ========================================================= */
        .numbered_row {
            position: relative;
            display: grid;
            grid-template-columns: 56px minmax(0, 1fr);
            gap: clamp(12px, 1.7vw, 39px);
            align-items: start;
            padding: clamp(26px, 2.8vw, 38px) 0;
            border-top: 1px solid transparent;
            border-image: linear-gradient(to right, #e0dae9, rgba(224, 218, 233, 0)) 1;
            color: var(--c-ink);
            font-family: var(--font-body);
            transition: padding-left .3s var(--ease-out-quint);
        }

        .numbered_row:hover {
            padding-left: 10px;
        }

        .numbered_row_number {
            position: absolute;
            top: clamp(26px, 2.8vw, 38px);
            right: 0;
            font-family: var(--font-heading);
            font-size: clamp(26px, 3vw, 42px);
            font-weight: var(--fw-extralight);
            line-height: .86;
            letter-spacing: -.045em;
            color: #c2bacf;
        }

        .numbered_row_tile {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(155deg, #f1f1f4 0%, rgba(241, 241, 244, 0) 100%);
        }

        .numbered_row_glyph {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .numbered_row_text {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }

        .numbered_row_title {
            margin: 0;
            font-size: clamp(20px, 2vw, 28px);
            font-weight: var(--fw-medium);
            line-height: 1.14;
            letter-spacing: -.025em;
            transition: color .25s ease;
        }

        .numbered_row:hover .numbered_row_title {
            color: var(--c-accent);
        }

        .numbered_row_copy {
            max-width: 46ch;
            font-size: 16px;
            line-height: 1.6;
            color: #5a5766;
            text-wrap: pretty;
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */
        @media (max-width: 640px) {
            .numbered_row {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }
