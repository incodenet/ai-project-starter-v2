<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Service 3D — Migration | Hybrid Interaction Design System</title>
    <meta name="description" content="The CRM Migration 3D service icon component.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap">

    <style>
        /* =========================================================
           DESIGN TOKENS
           Fonts, weights and the fluid type scale (hi-fonts.css + hi-typography.css),
           then colour, surface, radius, elevation, motion, space and layout
           (hi-tokens.css). Every page of the design system ships the same set.
        ========================================================= */
        :root {
            /* --- font families --- */
            --font-heading: 'Hanken Grotesk', system-ui, sans-serif;
            --font-caption: 'Hanken Grotesk', system-ui, sans-serif;
            --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;

            /* --- weights --- */
            --fw-extralight: 200;
            --fw-light: 300;
            --fw-regular: 400;
            --fw-medium: 500;
            --fw-semibold: 600;
            --fw-bold: 700;
            --fw-extrabold: 800;

            /* --- type scale (fluid) --- */
            --text-hero-size: clamp(40px, 6vw, 96px);
            --text-figure-size: clamp(48px, 8.6vw, 120px);
            --text-display-size: clamp(36px, 5.2vw, 78px);
            --text-h1-size: clamp(32px, 4.4vw, 64px);
            --text-h2-size: clamp(28px, 3.6vw, 52px);
            --text-h-feature-size: clamp(23px, 2.9vw, 42px);
            --text-h3-size: clamp(20px, 2vw, 27px);
            --text-body-lg-size: clamp(18px, 1.6vw, 22px);
            --text-body-md-size: 16.5px;
            --text-body-sm-size: 14.5px;
            --text-caption-size: 12px;
            --text-label-size: 15px;

            /* --- line heights --- */
            --lh-tight: 1;
            --lh-snug: 1.15;
            --lh-heading: 1.05;
            --lh-body: 1.6;

            /* --- letter spacing --- */
            --ls-hero: -.045em;
            --ls-heading: -.03em;
            --ls-h3: -.02em;
            --ls-caption: .2em;
            --ls-label: .02em;

            /* --- brand palette --- */
            --c-bg: #eaeaf2;
            --c-ink: #15131c;
            --c-dark: #180a2b;
            --c-dark-2: #170928;
            --c-accent: #7b52c7;
            --c-accent-bright: #9d73ff;
            --c-violet: #9b6fe0;
            --c-lav: #b79bff;
            --c-cyan: #00b7fa;
            --c-offwhite: #f1f8ff;
            --c-white: #ffffff;
            --c-grey: #6b6b76;
            --c-ds-panel: #12101a;

            /* --- text alpha steps --- */
            --c-ink-60: rgba(21, 19, 28, .6);
            --c-ink-55: rgba(21, 19, 28, .55);
            --c-ink-45: rgba(21, 19, 28, .45);
            --c-ink-16: rgba(21, 19, 28, .16);
            --c-offwhite-80: rgba(241, 248, 255, .8);
            --c-offwhite-62: rgba(241, 248, 255, .62);
            --c-offwhite-50: rgba(241, 248, 255, .5);
            --c-white-78: rgba(255, 255, 255, .78);
            --c-white-50: rgba(255, 255, 255, .5);
            --c-white-20: rgba(255, 255, 255, .2);
            --c-white-08: rgba(255, 255, 255, .08);

            /* --- partner brands --- */
            --brand-optimove: #302c69;
            --brand-optimove-pastel: #f4f4f7;
            --brand-smartico: #f15851;
            --brand-smartico-pastel: #fef2f1;
            --brand-fast-track: #e96092;
            --brand-fast-track-pastel: #fdf2f6;
            --brand-xtremepush: #003df5;
            --brand-xtremepush-pastel: #f1f4fe;
            --brand-customer-io: #0b363b;
            --brand-customer-io-pastel: #f2f4f5;
            --brand-solitics: #ffd400;
            --brand-solitics-pastel: #fff5c3;

            /* --- status --- */
            --c-success: #1f8a5b;
            --c-success-bright: #1fb26b;
            --c-success-soft: #1fd28a;
            --c-warning: #ffb038;
            --c-magenta: #c32e93;

            /* --- surfaces --- */
            --surface-light: #ffffff;
            --surface-tint: #faf8fd;
            --surface-tint-strong: #f7f4fd;
            --surface-neutral: #f1f1f4;
            --surface-hover: #f2f2f4;
            --grad-surface-grey: linear-gradient(145deg, #eeeef2 0%, #f6f6f8 52%, #ffffff 100%);
            --grad-surface-grey-dark: linear-gradient(145deg, rgba(255, 255, 255, .09) 0%, rgba(255, 255, 255, .05) 52%, rgba(255, 255, 255, .02) 100%);
            --grad-primary: linear-gradient(225deg, #8a62d8, #6a43b2);
            --grad-hero: linear-gradient(160deg, #1c0c3a 0%, #2c1356 44%, #46228a 100%);
            --grad-hero-deep: linear-gradient(160deg, #120724 0%, #1c0d38 46%, #2e155c 100%);
            --grad-card-dark: linear-gradient(135deg, #1a0a3a, #3d1a6e);
            --grad-card-dark-hover: linear-gradient(135deg, #26124f, #4d2589);
            --grad-panel: linear-gradient(180deg, #17161d, #111017);
            --grad-metric: linear-gradient(160deg, var(--c-accent), #4a248f);
            --grad-rule-light: linear-gradient(to right, rgba(21, 19, 28, .16), rgba(21, 19, 28, 0));
            --grad-rule-dark: linear-gradient(to right, rgba(255, 255, 255, .18), rgba(255, 255, 255, 0));

            /* --- borders --- */
            --border-light: 1px solid #eee9f6;
            --border-glass: 1px solid rgba(255, 255, 255, .16);
            --border-panel: 1px solid rgba(255, 255, 255, .07);
            --border-accent-soft: 1px solid rgba(123, 82, 199, .35);

            /* --- radii --- */
            --r-xs: 4px;
            --r-sm: 7px;
            --r-md: 12px;
            --r-lg: 16px;
            --r-xl: 20px;
            --r-2xl: 24px;
            --r-3xl: 26px;
            --r-pill: 100px;
            --r-circle: 50%;

            /* --- elevation --- */
            --shadow-tile: 0 4px 10px -4px rgba(24, 10, 43, .14), 0 1px 3px -1px rgba(24, 10, 43, .1);
            --shadow-pill: 0 8px 30px rgba(0, 0, 0, .28);
            --shadow-card: 0 24px 50px rgba(26, 10, 58, .12);
            --shadow-float: 0 20px 50px rgba(0, 0, 0, .35);
            --shadow-card-raised: 0 40px 90px rgba(26, 10, 58, .28);
            --shadow-card-hover: 0 54px 110px rgba(26, 10, 58, .42);
            --shadow-panel: 0 30px 70px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .05);
            --glow-accent: 0 4px 14px rgba(123, 82, 199, .6);

            /* --- blur --- */
            --blur-glass: 14px;
            --blur-card: 12px;

            /* --- motion --- */
            --dur-fast: .2s;
            --dur-base: .3s;
            --dur-mid: .4s;
            --dur-slow: .5s;
            --dur-shutter: .9s;
            --ease-out-quint: cubic-bezier(.16, 1, .3, 1);
            --ease-swift: cubic-bezier(.2, .8, .2, 1);
            --ease-standard: cubic-bezier(.4, 0, .2, 1);
            --ease-shutter: cubic-bezier(.76, 0, .24, 1);

            /* --- space --- */
            --space-xxs: 4px;
            --space-xs: 8px;
            --space-sm: 12px;
            --space-md: 14px;
            --space-lg: 16px;
            --space-xl: 20px;
            --space-2xl: 24px;
            --space-3xl: 34px;
            --space-4xl: 40px;
            --space-5xl: 56px;

            /* --- layout --- */
            --gutter: 5vw;
            --gut: max(5vw, calc((100vw - 1440px) / 2 + 5vw));
            --max-content: 1440px;
            --max-text: 1100px;
            --max-footer: 1280px;
            --nav-height: 78px;
            --ds-nav-width: 240px;
            --ds-sheet-max: 1120px;
            --ds-sheet-pad: 6vw;
        }

        /* =========================================================
           RESET
        ========================================================= */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--c-bg);
            color: var(--c-ink);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
        }

        /* NO percentage max-width here: logo marks sit in shrink-to-fit parents sized BY their
           image, and a percentage that resolves against such a parent collapses the image to 0.
           Containment is declared per component instead. */
        img,
        svg {
            display: block;
        }

        /* a component class with its own display value out-ranks the UA's [hidden] rule */
        [hidden] {
            display: none !important;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            margin: 0;
            font-family: var(--font-heading);
        }

        p {
            margin: 0;
        }

        button {
            font: inherit;
            color: inherit;
            cursor: pointer;
        }

        /* zero specificity: every component colour (buttons, tiles, menu rows, nav) wins in every state,
           the way the DC's inline styles beat its helmet link rule */
        :where(a) {
            color: var(--c-accent);
        }

        :where(a:hover) {
            color: #5a37a0;
        }

        code {
            font-family: var(--font-mono);
            font-size: .85em;
        }

        :focus-visible {
            outline: 2px solid rgba(157, 115, 255, .7);
            outline-offset: 2px;
        }

        .visually_hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        /* =========================================================
           TYPOGRAPHY
           The named type roles. Design-tool name in brackets:
           text_hero (.hi-hero) · text_figure (.hi-figure) · text_display (.hi-display)
           text_h1 / text_h2 / text_h_feature / text_h3 · eyebrow (.hi-eyebrow)
           figcaption (.hi-figcaption) · text_body_lg / _md / _sm · text_label
           prose--l/m/s + bullets (.hi-prose-*, .hi-bullets, .hi-bullet)
        ========================================================= */
        .text_hero {
            font-family: var(--font-heading);
            font-weight: var(--fw-light);
            font-size: var(--text-hero-size);
            line-height: .98;
            letter-spacing: var(--ls-hero);
        }

        .text_figure {
            font-family: var(--font-heading);
            font-weight: var(--fw-extralight);
            font-size: var(--text-figure-size);
            line-height: .82;
            letter-spacing: -.03em;
        }

        .text_display {
            font-family: var(--font-heading);
            font-weight: var(--fw-light);
            font-size: var(--text-display-size);
            line-height: var(--lh-tight);
            letter-spacing: -.04em;
        }

        .text_h1 {
            font-family: var(--font-heading);
            font-weight: var(--fw-light);
            font-size: var(--text-h1-size);
            line-height: 1.04;
            letter-spacing: -.035em;
        }

        .text_h2 {
            font-family: var(--font-heading);
            font-weight: var(--fw-light);
            font-size: var(--text-h2-size);
            line-height: var(--lh-heading);
            letter-spacing: var(--ls-heading);
        }

        .text_h_feature {
            font-family: var(--font-heading);
            font-weight: var(--fw-light);
            font-size: var(--text-h-feature-size);
            line-height: 1.1;
            letter-spacing: -.032em;
        }

        .text_h3 {
            font-family: var(--font-heading);
            font-weight: var(--fw-semibold);
            font-size: var(--text-h3-size);
            line-height: 1.2;
            letter-spacing: var(--ls-h3);
        }

        .eyebrow {
            font-family: var(--font-caption);
            font-weight: var(--fw-bold);
            font-size: var(--text-caption-size);
            line-height: 1;
            letter-spacing: var(--ls-caption);
            text-transform: uppercase;
        }

        .figcaption {
            font-family: var(--font-body);
            font-weight: var(--fw-regular);
            font-size: 13px;
            line-height: 1.5;
            letter-spacing: 0;
            text-transform: none;
            color: var(--c-ink-45);
        }

        .figcaption--on-dark {
            color: rgba(255, 255, 255, .5);
        }

        .text_body_lg {
            font-family: var(--font-body);
            font-weight: var(--fw-regular);
            font-size: var(--text-body-lg-size);
            line-height: var(--lh-body);
        }

        .text_body_md {
            font-family: var(--font-body);
            font-weight: var(--fw-regular);
            font-size: var(--text-body-md-size);
            line-height: var(--lh-body);
        }

        .text_body_sm {
            font-family: var(--font-body);
            font-weight: var(--fw-regular);
            font-size: var(--text-body-sm-size);
            line-height: 1.55;
        }

        .text_label {
            font-family: var(--font-body);
            font-weight: var(--fw-semibold);
            font-size: var(--text-label-size);
            letter-spacing: var(--ls-label);
        }

        /* --- body prose & bullets · sizes L / M / S --- */
        .prose--l,
        .bullets--l {
            --pf: clamp(17px, 1.5vw, 21px);
            --pl: 1.78;
            --bf: clamp(17px, 1.5vw, 21px);
            --bl: 1.6;
            --gap: clamp(11px, 1.2vw, 15px);
            --pad: 26px;
            --dot: 8px;
            --dtop: .62em;
            --bmar: clamp(20px, 2vw, 28px);
        }

        .prose--m,
        .bullets--m {
            --pf: clamp(15px, 1.25vw, 18px);
            --pl: 1.75;
            --bf: clamp(15px, 1.25vw, 18px);
            --bl: 1.6;
            --gap: clamp(10px, 1.05vw, 13px);
            --pad: 24px;
            --dot: 7px;
            --dtop: .6em;
            --bmar: clamp(18px, 1.7vw, 23px);
        }

        .prose--s,
        .bullets--s {
            --pf: clamp(14px, 1.05vw, 16px);
            --pl: 1.72;
            --bf: clamp(14px, 1.05vw, 16px);
            --bl: 1.58;
            --gap: 9px;
            --pad: 22px;
            --dot: 6px;
            --dtop: .6em;
            --bmar: 16px;
        }

        .prose {
            max-width: 64ch;
        }

        .prose > p {
            margin: 0;
            font-size: var(--pf);
            line-height: var(--pl);
            color: #33303e;
            text-wrap: pretty;
        }

        .prose > :not(:first-child) {
            margin-top: var(--bmar);
        }

        .bullets {
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .bullet {
            position: relative;
            padding-left: var(--pad);
            font-size: var(--bf);
            line-height: var(--bl);
            color: #33303e;
            text-wrap: pretty;
        }

        .bullet::before {
            content: "";
            position: absolute;
            left: 0;
            top: var(--dtop);
            width: var(--dot);
            height: var(--dot);
            border-radius: 2px;
            background: linear-gradient(135deg, #7b52c7, #9d73ff);
        }

        .bullet strong {
            font-weight: var(--fw-semibold);
            color: var(--c-ink);
        }

        /* =========================================================
           COMPONENTS — 3D service icons sheet + component stages
           Each preview is a live <hi-3d-icon> (renderer: "hi-3d-icons" script
           block) with rotation, flow, parallax and drag switched off — frozen.
        ========================================================= */
        .icons3d_body {
            background: #0d0518;
            color: var(--c-offwhite);
        }

        /* element-level link colour, kept at element specificity so components win */
        :where(.icons3d_body a) {
            color: #b18cff;
        }

        :where(.icons3d_body a:hover) {
            color: #d5c2ff;
        }

        .icons3d_page {
            background: radial-gradient(70% 50% at 78% 8%, rgba(123, 82, 199, .28), transparent 62%), #0d0518;
        }

        .icons3d_head {
            max-width: 1180px;
            padding: 86px var(--ds-sheet-pad) 44px;
        }

        .icons3d_eyebrow {
            margin-bottom: 20px;
            color: #b18cff;
        }

        .icons3d_title {
            margin: 0;
            color: var(--c-white);
        }

        .icons3d_lede {
            max-width: 60ch;
            margin: 22px 0 0;
            color: rgba(241, 248, 255, .56);
        }

        .icons3d_list {
            display: flex;
            flex-direction: column;
            gap: 22px;
            max-width: 1180px;
            padding: 0 var(--ds-sheet-pad) 110px;
        }

        .icons3d_body .icons3d_card {
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr) auto;
            align-items: center;
            gap: 36px;
            padding: 26px 34px 26px 26px;
            border: 1px solid rgba(177, 140, 255, .16);
            border-radius: var(--r-3xl);
            background: linear-gradient(120deg, rgba(42, 17, 82, .62), rgba(15, 8, 30, .5));
            color: inherit;
            text-decoration: none;
        }

        .icons3d_body .icons3d_card:hover {
            border-color: rgba(177, 140, 255, .4);
            background: linear-gradient(120deg, rgba(52, 22, 100, .72), rgba(20, 10, 40, .6));
            color: inherit;
        }

        .icons3d_preview {
            position: relative;
            display: block;
            width: 220px;
            height: 170px;
        }

        .icons3d_preview_box {
            position: absolute;
            left: 50%;
            top: 50%;
            display: block;
            width: 94px;
            height: 94px;
            transform: translate(-50%, -50%);
        }

        .icon3d {
            position: absolute;
            inset: 0;
            display: block;
        }

        .icons3d_text {
            display: block;
        }

        .icons3d_card_eyebrow {
            display: block;
            margin-bottom: 12px;
            color: rgba(177, 140, 255, .75);
        }

        /* the design references a .hi-h4 role that the type sheet never defines, so the
           title renders in the inherited body face at 16px — reproduced as-is */
        .icons3d_card_title {
            display: block;
            margin: 0 0 10px;
            font-family: var(--font-body);
            font-size: 16px;
            font-weight: var(--fw-regular);
            color: var(--c-white);
        }

        .icons3d_card_text {
            display: block;
            max-width: 56ch;
            font-size: 14.5px;
            line-height: 1.6;
            color: rgba(241, 248, 255, .52);
        }

        .icons3d_go {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-size: 13px;
            font-weight: var(--fw-semibold);
            white-space: nowrap;
            color: #b18cff;
        }

        /* --- 3D Icon Lab --- */
        .lab3d_body {
            background: #08070c;
        }

        .lab3d_page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 60px 5vw;
            background: #08070c;
            color: var(--c-offwhite);
            font-family: var(--font-body);
        }

        .lab3d_head {
            text-align: center;
        }

        .lab3d_kicker {
            font-family: var(--font-caption);
            font-size: 12px;
            font-weight: var(--fw-semibold);
            letter-spacing: .3em;
            text-transform: uppercase;
            color: rgba(241, 248, 255, .45);
        }

        .lab3d_lede {
            max-width: 52ch;
            margin: 14px 0 0;
            font-size: 15px;
            line-height: 1.6;
            color: rgba(241, 248, 255, .55);
        }

        .lab3d_row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 70px;
        }

        .lab3d_hero {
            position: relative;
            width: min(320px, 60vw);
            aspect-ratio: 1;
        }

        .lab3d_side {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 26px;
        }

        .lab3d_small {
            position: relative;
            width: 130px;
            aspect-ratio: 1;
        }

        .lab3d_label {
            font-family: var(--font-caption);
            font-size: 11px;
            font-weight: var(--fw-semibold);
            letter-spacing: .2em;
            text-transform: uppercase;
            color: rgba(241, 248, 255, .35);
        }

        .lab3d_note {
            font-size: 12px;
            color: rgba(241, 248, 255, .35);
        }

        /* --- standalone component stage (Service 3D — *) --- */
        .stage3d_body {
            margin: 0;
        }

        .stage3d {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(60% 60% at 50% 42%, #2a1152 0%, #150827 62%, #0d0518 100%);
            overflow: hidden;
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */
        @media (max-width: 1150px) {
            .icons3d_body .icons3d_card {
                grid-template-columns: 150px minmax(0, 1fr);
                row-gap: 14px;
                column-gap: 24px;
            }

            .icons3d_preview {
                width: 150px;
                height: 130px;
            }

            .icons3d_go {
                grid-column: 2;
                justify-self: start;
            }
        }
    </style>

                self.removeEventListener('pointermove', onDrag);
                window.removeEventListener('pointerup', onUp);
              };
            };

            ctor.prototype.disconnectedCallback = function () {
              if (this._pause) this._pause();
            };
            return ctor;
          })();

          customElements.define('hi-3d-icon', HI3DIcon);
          setInterval(function () {
            var now = performance.now();
            instances.forEach(function (el) {
              if (!el._three || !el.isConnected) return;
              var r = el.getBoundingClientRect();
              if (!r.width) return;
              var onScreen = r.bottom > -80 && r.top < window.innerHeight + 80;
              var cv = el._cv;
              var expect = Math.round(r.width * (el._bleed || BLEED) * Math.min(window.devicePixelRatio || 1, 2));
              if (cv && expect > 4 && Math.abs(cv.width - expect) > Math.max(8, expect * 0.15) && el._resize) el._resize();
              if (onScreen && (el._paused || now - (el._beat || 0) > 900) && el._resume) el._resume();
            });
          }, 1000);
          window.HI3D = {
            insetShapes: insetShapes,
            register: register,
            icons: icons,
            defaults: DEFAULTS,
            saveConfig: function (cfg) {
              try { localStorage.setItem(LS_KEY, JSON.stringify(cfg)); } catch (e) {}
              window.dispatchEvent(new Event('hi3d-config'));
            },
            readConfig: readConfig
          };
        })();
    </script>
</body>
</html>
