<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Filter Tabs | Hybrid Interaction Design System</title>
    <meta name="description" content="The Filter Tabs component at its default props.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap">

    <style>
        /* =========================================================
           DESIGN TOKENS
           Fonts, weights and the fluid type scale (hi-fonts.css + hi-typography.css),
           then colour, surface, radius, elevation, motion, space and layout
           (hi-tokens.css). Every page of the design system ships the same set.
        ========================================================= */
        :root {
            /* --- font families --- */
            --font-heading: 'Hanken Grotesk', system-ui, sans-serif;
            --font-caption: 'Hanken Grotesk', system-ui, sans-serif;
            --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;

            /* --- weights --- */
            --fw-extralight: 200;
            --fw-light: 300;
            --fw-regular: 400;
            --fw-medium: 500;
            --fw-semibold: 600;
            --fw-bold: 700;
            --fw-extrabold: 800;

            /* --- type scale (fluid) --- */
            --text-hero-size: clamp(40px, 6vw, 96px);
            --text-figure-size: clamp(48px, 8.6vw, 120px);
            --text-display-size: clamp(36px, 5.2vw, 78px);
            --text-h1-size: clamp(32px, 4.4vw, 64px);
            --text-h2-size: clamp(28px, 3.6vw, 52px);
            --text-h-feature-size: clamp(23px, 2.9vw, 42px);
            --text-h3-size: clamp(20px, 2vw, 27px);
            --text-body-lg-size: clamp(18px, 1.6vw, 22px);
            --text-body-md-size: 16.5px;
            --text-body-sm-size: 14.5px;
            --text-caption-size: 12px;
            --text-label-size: 15px;

            /* --- line heights --- */
            --lh-tight: 1;
            --lh-snug: 1.15;
            --lh-heading: 1.05;
            --lh-body: 1.6;

            /* --- letter spacing --- */
            --ls-hero: -.045em;
            --ls-heading: -.03em;
            --ls-h3: -.02em;
            --ls-caption: .2em;
            --ls-label: .02em;

            /* --- brand palette --- */
            --c-bg: #eaeaf2;
            --c-ink: #15131c;
            --c-dark: #180a2b;
            --c-dark-2: #170928;
            --c-accent: #7b52c7;
            --c-accent-bright: #9d73ff;
            --c-violet: #9b6fe0;
            --c-lav: #b79bff;
            --c-cyan: #00b7fa;
            --c-offwhite: #f1f8ff;
            --c-white: #ffffff;
            --c-grey: #6b6b76;
            --c-ds-panel: #12101a;

            /* --- text alpha steps --- */
            --c-ink-60: rgba(21, 19, 28, .6);
            --c-ink-55: rgba(21, 19, 28, .55);
            --c-ink-45: rgba(21, 19, 28, .45);
            --c-ink-16: rgba(21, 19, 28, .16);
            --c-offwhite-80: rgba(241, 248, 255, .8);
            --c-offwhite-62: rgba(241, 248, 255, .62);
            --c-offwhite-50: rgba(241, 248, 255, .5);
            --c-white-78: rgba(255, 255, 255, .78);
            --c-white-50: rgba(255, 255, 255, .5);
            --c-white-20: rgba(255, 255, 255, .2);
            --c-white-08: rgba(255, 255, 255, .08);

            /* --- partner brands --- */
            --brand-optimove: #302c69;
            --brand-optimove-pastel: #f4f4f7;
            --brand-smartico: #f15851;
            --brand-smartico-pastel: #fef2f1;
            --brand-fast-track: #e96092;
            --brand-fast-track-pastel: #fdf2f6;
            --brand-xtremepush: #003df5;
            --brand-xtremepush-pastel: #f1f4fe;
            --brand-customer-io: #0b363b;
            --brand-customer-io-pastel: #f2f4f5;
            --brand-solitics: #ffd400;
            --brand-solitics-pastel: #fff5c3;

            /* --- status --- */
            --c-success: #1f8a5b;
            --c-success-bright: #1fb26b;
            --c-success-soft: #1fd28a;
            --c-warning: #ffb038;
            --c-magenta: #c32e93;

            /* --- surfaces --- */
            --surface-light: #ffffff;
            --surface-tint: #faf8fd;
            --surface-tint-strong: #f7f4fd;
            --surface-neutral: #f1f1f4;
            --surface-hover: #f2f2f4;
            --grad-surface-grey: linear-gradient(145deg, #eeeef2 0%, #f6f6f8 52%, #ffffff 100%);
            --grad-surface-grey-dark: linear-gradient(145deg, rgba(255, 255, 255, .09) 0%, rgba(255, 255, 255, .05) 52%, rgba(255, 255, 255, .02) 100%);
            --grad-primary: linear-gradient(225deg, #8a62d8, #6a43b2);
            --grad-hero: linear-gradient(160deg, #1c0c3a 0%, #2c1356 44%, #46228a 100%);
            --grad-hero-deep: linear-gradient(160deg, #120724 0%, #1c0d38 46%, #2e155c 100%);
            --grad-card-dark: linear-gradient(135deg, #1a0a3a, #3d1a6e);
            --grad-card-dark-hover: linear-gradient(135deg, #26124f, #4d2589);
            --grad-panel: linear-gradient(180deg, #17161d, #111017);
            --grad-metric: linear-gradient(160deg, var(--c-accent), #4a248f);
            --grad-rule-light: linear-gradient(to right, rgba(21, 19, 28, .16), rgba(21, 19, 28, 0));
            --grad-rule-dark: linear-gradient(to right, rgba(255, 255, 255, .18), rgba(255, 255, 255, 0));

            /* --- borders --- */
            --border-light: 1px solid #eee9f6;
            --border-glass: 1px solid rgba(255, 255, 255, .16);
            --border-panel: 1px solid rgba(255, 255, 255, .07);
            --border-accent-soft: 1px solid rgba(123, 82, 199, .35);

            /* --- radii --- */
            --r-xs: 4px;
            --r-sm: 7px;
            --r-md: 12px;
            --r-lg: 16px;
            --r-xl: 20px;
            --r-2xl: 24px;
            --r-3xl: 26px;
            --r-pill: 100px;
            --r-circle: 50%;

            /* --- elevation --- */
            --shadow-tile: 0 4px 10px -4px rgba(24, 10, 43, .14), 0 1px 3px -1px rgba(24, 10, 43, .1);
            --shadow-pill: 0 8px 30px rgba(0, 0, 0, .28);
            --shadow-card: 0 24px 50px rgba(26, 10, 58, .12);
            --shadow-float: 0 20px 50px rgba(0, 0, 0, .35);
            --shadow-card-raised: 0 40px 90px rgba(26, 10, 58, .28);
            --shadow-card-hover: 0 54px 110px rgba(26, 10, 58, .42);
            --shadow-panel: 0 30px 70px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .05);
            --glow-accent: 0 4px 14px rgba(123, 82, 199, .6);

            /* --- blur --- */
            --blur-glass: 14px;
            --blur-card: 12px;

            /* --- motion --- */
            --dur-fast: .2s;
            --dur-base: .3s;
            --dur-mid: .4s;
            --dur-slow: .5s;
            --dur-shutter: .9s;
            --ease-out-quint: cubic-bezier(.16, 1, .3, 1);
            --ease-swift: cubic-bezier(.2, .8, .2, 1);
            --ease-standard: cubic-bezier(.4, 0, .2, 1);
            --ease-shutter: cubic-bezier(.76, 0, .24, 1);

            /* --- space --- */
            --space-xxs: 4px;
            --space-xs: 8px;
            --space-sm: 12px;
            --space-md: 14px;
            --space-lg: 16px;
            --space-xl: 20px;
            --space-2xl: 24px;
            --space-3xl: 34px;
            --space-4xl: 40px;
            --space-5xl: 56px;

            /* --- layout --- */
            --gutter: 5vw;
            --gut: max(5vw, calc((100vw - 1440px) / 2 + 5vw));
            --max-content: 1440px;
            --max-text: 1100px;
            --max-footer: 1280px;
            --nav-height: 78px;
            --ds-nav-width: 240px;
            --ds-sheet-max: 1120px;
            --ds-sheet-pad: 6vw;
        }

        /* =========================================================
           RESET
        ========================================================= */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--c-bg);
            color: var(--c-ink);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
        }

        /* NO percentage max-width here: logo marks sit in shrink-to-fit parents sized BY their
           image, and a percentage that resolves against such a parent collapses the image to 0.
           Containment is declared per component instead. */
        img,
        svg {
            display: block;
        }

        /* a component class with its own display value out-ranks the UA's [hidden] rule */
        [hidden] {
            display: none !important;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            margin: 0;
            font-family: var(--font-heading);
        }

        p {
            margin: 0;
        }

        button {
            font: inherit;
            color: inherit;
            cursor: pointer;
        }

        /* zero specificity: every component colour (buttons, tiles, menu rows, nav) wins in every state,
           the way the DC's inline styles beat its helmet link rule */
        :where(a) {
            color: var(--c-accent);
        }

        :where(a:hover) {
            color: #5a37a0;
        }

        code {
            font-family: var(--font-mono);
            font-size: .85em;
        }

        :focus-visible {
            outline: 2px solid rgba(157, 115, 255, .7);
            outline-offset: 2px;
        }

        .visually_hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        /* =========================================================
           TYPOGRAPHY
           The named type roles. Design-tool name in brackets:
           text_hero (.hi-hero) · text_figure (.hi-figure) · text_display (.hi-display)
           text_h1 / text_h2 / text_h_feature / text_h3 · eyebrow (.hi-eyebrow)
           figcaption (.hi-figcaption) · text_body_lg / _md / _sm · text_label
           prose--l/m/s + bullets (.hi-prose-*, .hi-bullets, .hi-bullet)
        ========================================================= */
        .text_hero {
            font-family: var(--font-heading);
            font-weight: var(--fw-light);
            font-size: var(--text-hero-size);
            line-height: .98;
            letter-spacing: var(--ls-hero);
        }

        .text_figure {
            font-family: var(--font-heading);
            font-weight: var(--fw-extralight);
            font-size: var(--text-figure-size);
            line-height: .82;
            letter-spacing: -.03em;
        }

        .text_display {
            font-family: var(--font-heading);
            font-weight: var(--fw-light);
            font-size: var(--text-display-size);
            line-height: var(--lh-tight);
            letter-spacing: -.04em;
        }

        .text_h1 {
            font-family: var(--font-heading);
            font-weight: var(--fw-light);
            font-size: var(--text-h1-size);
            line-height: 1.04;
            letter-spacing: -.035em;
        }

        .text_h2 {
            font-family: var(--font-heading);
            font-weight: var(--fw-light);
            font-size: var(--text-h2-size);
            line-height: var(--lh-heading);
            letter-spacing: var(--ls-heading);
        }

        .text_h_feature {
            font-family: var(--font-heading);
            font-weight: var(--fw-light);
            font-size: var(--text-h-feature-size);
            line-height: 1.1;
            letter-spacing: -.032em;
        }

        .text_h3 {
            font-family: var(--font-heading);
            font-weight: var(--fw-semibold);
            font-size: var(--text-h3-size);
            line-height: 1.2;
            letter-spacing: var(--ls-h3);
        }

        .eyebrow {
            font-family: var(--font-caption);
            font-weight: var(--fw-bold);
            font-size: var(--text-caption-size);
            line-height: 1;
            letter-spacing: var(--ls-caption);
            text-transform: uppercase;
        }

        .figcaption {
            font-family: var(--font-body);
            font-weight: var(--fw-regular);
            font-size: 13px;
            line-height: 1.5;
            letter-spacing: 0;
            text-transform: none;
            color: var(--c-ink-45);
        }

        .figcaption--on-dark {
            color: rgba(255, 255, 255, .5);
        }

        .text_body_lg {
            font-family: var(--font-body);
            font-weight: var(--fw-regular);
            font-size: var(--text-body-lg-size);
            line-height: var(--lh-body);
        }

        .text_body_md {
            font-family: var(--font-body);
            font-weight: var(--fw-regular);
            font-size: var(--text-body-md-size);
            line-height: var(--lh-body);
        }

        .text_body_sm {
            font-family: var(--font-body);
            font-weight: var(--fw-regular);
            font-size: var(--text-body-sm-size);
            line-height: 1.55;
        }

        .text_label {
            font-family: var(--font-body);
            font-weight: var(--fw-semibold);
            font-size: var(--text-label-size);
            letter-spacing: var(--ls-label);
        }

        /* --- body prose & bullets · sizes L / M / S --- */
        .prose--l,
        .bullets--l {
            --pf: clamp(17px, 1.5vw, 21px);
            --pl: 1.78;
            --bf: clamp(17px, 1.5vw, 21px);
            --bl: 1.6;
            --gap: clamp(11px, 1.2vw, 15px);
            --pad: 26px;
            --dot: 8px;
            --dtop: .62em;
            --bmar: clamp(20px, 2vw, 28px);
        }

        .prose--m,
        .bullets--m {
            --pf: clamp(15px, 1.25vw, 18px);
            --pl: 1.75;
            --bf: clamp(15px, 1.25vw, 18px);
            --bl: 1.6;
            --gap: clamp(10px, 1.05vw, 13px);
            --pad: 24px;
            --dot: 7px;
            --dtop: .6em;
            --bmar: clamp(18px, 1.7vw, 23px);
        }

        .prose--s,
        .bullets--s {
            --pf: clamp(14px, 1.05vw, 16px);
            --pl: 1.72;
            --bf: clamp(14px, 1.05vw, 16px);
            --bl: 1.58;
            --gap: 9px;
            --pad: 22px;
            --dot: 6px;
            --dtop: .6em;
            --bmar: 16px;
        }

        .prose {
            max-width: 64ch;
        }

        .prose > p {
            margin: 0;
            font-size: var(--pf);
            line-height: var(--pl);
            color: #33303e;
            text-wrap: pretty;
        }

        .prose > :not(:first-child) {
            margin-top: var(--bmar);
        }

        .bullets {
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .bullet {
            position: relative;
            padding-left: var(--pad);
            font-size: var(--bf);
            line-height: var(--bl);
            color: #33303e;
            text-wrap: pretty;
        }

        .bullet::before {
            content: "";
            position: absolute;
            left: 0;
            top: var(--dtop);
            width: var(--dot);
            height: var(--dot);
            border-radius: 2px;
            background: linear-gradient(135deg, #7b52c7, #9d73ff);
        }

        .bullet strong {
            font-weight: var(--fw-semibold);
            color: var(--c-ink);
        }

        /* =========================================================
           LAYOUT — component file stage
           A component file opened on its own: the component alone on a blank page,
           at its default props, exactly as the design tool previews it.
        ========================================================= */
        .component_body {
            background: var(--c-white);
        }

        .component_stage {
            display: block;
        }

        /* =========================================================
           COMPONENTS — filter tabs (Filter Tabs.dc.html, .hi-tabbar / .hi-tab)
           Uppercase labels on a baseline; the active one carries an underline that
           draws in from the left. Two calibrations from the live hubs:
           light listing — 16px to the rule, 2px #7b52c7 underline, optional rule
           dark hero     — 20px to the baseline, 3px #9d73ff underline
           The bar never wraps: it scrolls, and a measured mask fades the clipped
           side (see the "Filter tabs" script). tabs--segmented is the control
           variant: a recessed track, the active tab lifted onto its own plate.
        ========================================================= */
        .tabs {
            display: flex;
            flex-wrap: nowrap;
            align-items: baseline;
            gap: 14px clamp(22px, 2.6vw, 40px);
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            overscroll-behavior-x: contain;
            scroll-snap-type: x proximity;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tabs--rule {
            background-image: linear-gradient(to right, #d7d7dd, rgba(215, 215, 221, 0));
            background-position: left bottom;
            background-repeat: no-repeat;
            background-size: 100% 2px;
        }

        .tabs--dark.tabs--rule {
            background-image: linear-gradient(to right, rgba(255, 255, 255, .28), rgba(255, 255, 255, 0));
        }

        /* the fade is a MASK so the labels themselves fade; its lengths come from the script */
        .tabs--scrollfade {
            --tab-fade-l: 0px;
            --tab-fade-r: 0px;
            -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--tab-fade-l), #000 calc(100% - var(--tab-fade-r)), transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 var(--tab-fade-l), #000 calc(100% - var(--tab-fade-r)), transparent 100%);
        }

        .tabs_item {
            position: relative;
            flex: 0 0 auto;
            margin: 0;
            padding: 0 0 var(--tab-pad, 16px);
            border: 0;
            background: none;
            font-family: var(--font-caption);
            font-size: 13px;
            font-weight: var(--fw-semibold);
            line-height: 1;
            letter-spacing: .16em;
            text-transform: uppercase;
            white-space: nowrap;
            scroll-snap-align: start;
            cursor: pointer;
            appearance: none;
            transition: color .25s ease;
        }

        .tabs_item::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--tab-line, 2px);
            background: var(--tab-line-colour, #7b52c7);
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform .4s var(--ease-out-quint);
        }

        .tabs_item[aria-selected="true"]::after {
            transform: scaleX(1);
        }

        /* label swap on hover, the same mechanism as the Button */
        .tabs_mask {
            position: relative;
            display: inline-block;
            overflow: hidden;
        }

        .tabs_track {
            position: relative;
            display: block;
            transition: transform .42s var(--ease-out-quint);
        }

        .tabs_track > span[aria-hidden] {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            white-space: nowrap;
        }

        .tabs_item:hover .tabs_track {
            transform: translateY(-100%);
        }

        /* --- ink --- */
        .tabs--light .tabs_item {
            color: var(--c-grey);
        }

        .tabs--light .tabs_item:hover,
        .tabs--light .tabs_item[aria-selected="true"] {
            color: var(--c-ink);
        }

        .tabs--dark .tabs_item {
            --tab-pad: 20px;
            --tab-line: 3px;
            --tab-line-colour: #9d73ff;
            color: rgba(255, 255, 255, .5);
        }

        .tabs--dark .tabs_item:hover,
        .tabs--dark .tabs_item[aria-selected="true"] {
            color: var(--c-white);
        }

        /* --- segmented: the bar IS the control --- */
        .tabs--segmented {
            display: flex;
            gap: 4px;
            padding: 4px;
            overflow: visible;
            border: 0;
            border-radius: var(--r-pill);
            background: #f1f1f4;
            -webkit-mask-image: none;
            mask-image: none;
        }

        .tabs--segmented .tabs_item {
            flex: 1 1 0;
            justify-content: center;
            min-width: 0;
            padding: 11px 14px;
            border-radius: var(--r-pill);
            background: transparent;
            text-align: center;
            transition:
                background .28s var(--ease-out-quint),
                box-shadow .28s var(--ease-out-quint),
                color .2s ease;
        }

        .tabs--segmented .tabs_item::after {
            display: none;
        }

        .tabs--segmented .tabs_item[aria-selected="true"] {
            position: relative;
            z-index: 1;
            background: var(--c-white);
            color: var(--c-accent);
            box-shadow: 0 2px 4px rgba(26, 10, 58, .14), 0 10px 24px -8px rgba(26, 10, 58, .34);
        }

        .tabs--segmented.tabs--dark {
            border: 0;
            background: rgba(255, 255, 255, .08);
        }

        .tabs--segmented.tabs--dark .tabs_item[aria-selected="true"] {
            background: rgba(255, 255, 255, .2);
            box-shadow: 0 2px 4px rgba(0, 0, 0, .34), 0 12px 26px -10px rgba(0, 0, 0, .6);
        }

        /* switching a tab re-introduces the panel's items instead of swapping them dead */
        .tabs_panel_item--in {
            animation: tabs_item_in .5s var(--ease-out-quint) both;
        }

        /* =========================================================
           ANIMATIONS
        ========================================================= */
        @keyframes tabs_item_in {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .tabs_panel_item--in {
                animation: none !important;
            }
        }
    </style>
</head>

<body class="component_body">
    <!-- ========================= FILTER TABS ========================= -->
    <main class="component_stage" id="main" aria-label="Filter Tabs component">
        <div class="tabs tabs--light tabs--scrollfade" role="tablist" aria-label="Post categories" data-tabs>
            <button class="tabs_item" type="button" role="tab" data-tab="all" aria-selected="true"><span class="tabs_mask"><span class="tabs_track"><span>All posts</span><span aria-hidden="true">All posts</span></span></span></button>
            <button class="tabs_item" type="button" role="tab" data-tab="company" aria-selected="false"><span class="tabs_mask"><span class="tabs_track"><span>Company</span><span aria-hidden="true">Company</span></span></span></button>
            <button class="tabs_item" type="button" role="tab" data-tab="conference" aria-selected="false"><span class="tabs_mask"><span class="tabs_track"><span>Conference</span><span aria-hidden="true">Conference</span></span></span></button>
            <button class="tabs_item" type="button" role="tab" data-tab="interview" aria-selected="false"><span class="tabs_mask"><span class="tabs_track"><span>Interview</span><span aria-hidden="true">Interview</span></span></span></button>
            <button class="tabs_item" type="button" role="tab" data-tab="fun" aria-selected="false"><span class="tabs_mask"><span class="tabs_track"><span>Fun</span><span aria-hidden="true">Fun</span></span></span></button>
        </div>
    </main>

    <script>
        /* =========================================================
           Filter tabs
           [data-tabs] bars keep their own selection (aria-selected) and fire a
           bubbling "tabs:change" event ({ detail: { key } }) so a page can filter
           its own cards. The panel — [data-tabpanel] in the same section, or the
           bar's data-tabs-panel selector — replays its visible items with a 26ms
           stagger (capped at 420ms) two frames after the pick.
           Every .tabs--scrollfade bar measures its overflow and fades only the side
           that is actually cut; a picked or focused tab that is clipped is pulled
           fully into view by tweening the bar's own scrollLeft (380ms, 46px
           clearance, snapping suspended) — never scrollIntoView.
        ========================================================= */
        (function () {
            const FADE = 46;
            const STAGGER = 26;
            const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            /* ---- edge fades ---- */
            const syncFade = bar => {
                const max = bar.scrollWidth - bar.clientWidth;
                if (max <= 1) {
                    bar.style.setProperty('--tab-fade-l', '0px');
                    bar.style.setProperty('--tab-fade-r', '0px');
                    return;
                }
                const x = bar.scrollLeft;
                bar.style.setProperty('--tab-fade-l', Math.max(0, Math.min(FADE, x)).toFixed(1) + 'px');
                bar.style.setProperty('--tab-fade-r', Math.max(0, Math.min(FADE, max - x)).toFixed(1) + 'px');
            };

            /* ---- pull a clipped tab into view ---- */
            const reveal = (bar, tab) => {
                if (bar.classList.contains('tabs--segmented')) return;
                const max = bar.scrollWidth - bar.clientWidth;
                if (max <= 1) return;
                const pad = bar.classList.contains('tabs--scrollfade') ? FADE : 8;
                const left = tab.offsetLeft - bar.offsetLeft;
                const right = left + tab.offsetWidth;
                const from = bar.scrollLeft;
                let target = from;
                if (left - pad < from) target = left - pad;
                else if (right + pad > from + bar.clientWidth) target = right + pad - bar.clientWidth;
                target = Math.max(0, Math.min(max, target));
                if (Math.abs(target - from) < 1) return;

                const snap = bar.style.scrollSnapType;
                bar.style.scrollSnapType = 'none';
                if (bar.tabsTween) cancelAnimationFrame(bar.tabsTween);
                const done = () => {
                    bar.tabsTween = null;
                    clearTimeout(bar.tabsSafety);
                    bar.style.scrollSnapType = snap || '';
                    if (bar.classList.contains('tabs--scrollfade')) syncFade(bar);
                };
                if (reduce) {
                    bar.scrollLeft = target;
                    done();
                    return;
                }
                const distance = target - from;
                const start = performance.now();
                const DURATION = 380;
                const step = now => {
                    const p = Math.min(1, (now - start) / DURATION);
                    bar.scrollLeft = from + distance * (1 - Math.pow(1 - p, 4));
                    if (p < 1) bar.tabsTween = requestAnimationFrame(step);
                    else done();
                };
                bar.tabsTween = requestAnimationFrame(step);
                /* rAF pauses in a background frame: land on the target regardless */
                clearTimeout(bar.tabsSafety);
                bar.tabsSafety = setTimeout(() => {
                    if (!bar.tabsTween) return;
                    cancelAnimationFrame(bar.tabsTween);
                    bar.scrollLeft = target;
                    done();
                }, DURATION + 260);
            };

            const onPick = event => {
                const tab = event.target.closest && event.target.closest('.tabs_item');
                if (!tab) return;
                const bar = tab.closest('.tabs');
                if (bar) setTimeout(() => reveal(bar, tab), 0);
            };
            document.addEventListener('click', onPick, true);
            document.addEventListener('focusin', onPick, true);

            const bars = document.querySelectorAll('.tabs--scrollfade');
            bars.forEach(bar => {
                bar.addEventListener('scroll', () => syncFade(bar), { passive: true });
                if (window.ResizeObserver) new ResizeObserver(() => syncFade(bar)).observe(bar);
                syncFade(bar);
            });
            const syncAll = () => bars.forEach(syncFade);
            window.addEventListener('resize', syncAll);
            window.addEventListener('load', syncAll);
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncAll);

            /* ---- selection + panel replay ---- */
            const findPanel = bar => {
                const selector = bar.getAttribute('data-tabs-panel');
                const scope = bar.closest('section') || document;
                if (selector) return scope.querySelector(selector) || document.querySelector(selector);
                return scope.querySelector('[data-tabpanel]');
            };

            const replay = bar => {
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    const panel = findPanel(bar);
                    if (!panel) return;
                    const shown = [...panel.children].filter(el => !el.hidden && getComputedStyle(el).display !== 'none');
                    shown.forEach((el, i) => {
                        el.classList.remove('tabs_panel_item--in');
                        void el.offsetWidth;
                        el.style.animationDelay = Math.min(i * STAGGER, 420) + 'ms';
                        el.classList.add('tabs_panel_item--in');
                    });
                }));
            };

            document.querySelectorAll('[data-tabs]').forEach(bar => {
                bar.addEventListener('click', event => {
                    const tab = event.target.closest('.tabs_item');
                    if (!tab || !bar.contains(tab)) return;
                    bar.querySelectorAll('.tabs_item').forEach(item => {
                        item.setAttribute('aria-selected', String(item === tab));
                    });
                    bar.dispatchEvent(new CustomEvent('tabs:change', {
                        bubbles: true,
                        detail: { key: tab.getAttribute('data-tab') }
                    }));
                    replay(bar);
                });
            });
        })();
    </script>
</body>
</html>
