</style><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&amp;display=swap" rel="stylesheet"></helmet>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;480px&quot;,&quot;height&quot;:&quot;40px&quot;},&quot;firstLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;firstHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;index.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;firstClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e) =&gt; void&quot;},&quot;midLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;midHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Current page&quot;,&quot;tsType&quot;:&quot;string&quot;}}">

  renderVals() {
    const p = this.props;
    return {
      firstLabel: p.firstLabel ?? 'Home',
      firstHref: p.firstHref ?? 'index.html',
      firstClick: p.firstClick,
      hasMid: !!p.midLabel,

      current: p.current ?? 'Current page'
    };

}
